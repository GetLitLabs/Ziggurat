# Ziggurat v1.0.0 workspace. Members are crates that compile, nothing else.
[workspace]
resolver = "2"
members = [
    "crates/hcc-types",
    "crates/hcc-seal",
    "crates/hcc-xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "LicenseRef-HCC-Sovereign-Perpetual"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
hcc-types = { path = "crates/hcc-types" }
hcc-seal = { path = "crates/hcc-seal" }
blake3 = { version = "1.8", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false }
getrandom = "0.2"
hex = "0.4"
